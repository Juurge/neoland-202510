<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cerdito, Casa y Marciano</title>
  <style>
    /* === Utility Classes === */
    .abs { position: absolute; }
    .rel { position: relative; }
    .rounded-full { border-radius: 50%; }
    .rounded-half { border-radius: 20px; }
    .rounded-bottom { border-radius: 0 0 20px 20px; }

    /* Colors */
    .bg-blue { background-color: #87ceeb; }
    .bg-pink { background-color: #f9b3c2; }
    .bg-darkpink { background-color: #f48ca1; }
    .bg-green { background-color: #4CAF50; }
    .bg-brown { background-color: #5b3a1a; }
    .bg-lightbrown { background-color: #e0b084; }
    .bg-chimney { background-color: #8b0000; }
    .bg-white { background-color: white; }
    .bg-black { background-color: black; }

    /* Sizes */
    .w-100 { width: 100px; }
    .h-100 { height: 100px; }
    .w-25 { width: 25px; }
    .h-25 { height: 25px; }
    .w-28 { width: 28px; }
    .h-28 { height: 28px; }
    .w-40 { width: 40px; }
    .h-20 { height: 20px; }
    .w-50 { width: 50px; }
    .h-10 { height: 10px; }
    .w-6 { width: 6px; }
    .h-6 { height: 6px; }
    .w-12 { width: 12px; } /* Pupilas más grandes */
    .h-12 { height: 12px; }

    /* Flex helpers para centrar */
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }

    body {
      background-color: rgb(21, 51, 77);
      margin: 0;
      padding: 0;
    }

    /* === Marciano === */
    .alien {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 200px;
      height: 350px;
      transform: scale(0.65);
      transform-origin: top right;
    }

    .alien-head {
      width: 100%;
      height: 250px;
      background-color: #4CAF50;
      border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
      position: relative;
    }

    .alien-eye {
      width: 50px;
      height: 70px;
      background-color: white;
      border-radius: 50%;
      position: absolute;
      top: 60px;
    }

    .alien-eye.left { left: 30px; transform: rotate(-15deg); }
    .alien-eye.right { right: 30px; transform: rotate(15deg); }

    .alien-pupil {
      width: 20px;
      height: 30px;
      background-color: black;
      border-radius: 50%;
      position: absolute;
      top: 20px;
      left: 15px;
    }

    .alien-mouth {
      width: 80px;
      height: 20px;
      background-color: black;
      border-radius: 0 0 40px 40px;
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
    }

    .alien-body {
      width: 60px;
      height: 100px;
      background-color: #4CAF50;
      border-radius: 30px / 50px;
      position: absolute;
      top: 250px;
      left: 50%;
      transform: translateX(-50%);
    }

    .alien-arm {
      width: 20px;
      height: 80px;
      background-color: #4CAF50;
      border-radius: 10px;
      position: absolute;
      top: 250px;
    }

    .alien-arm.left { left: calc(50% - 40px); }
    .alien-arm.right { left: calc(50% + 20px); }

    .alien-leg {
      width: 20px;
      height: 60px;
      background-color: #4CAF50;
      border-radius: 10px;
      position: absolute;
      top: 350px;
    }

    .alien-leg.left { left: calc(50% - 20px); }
    .alien-leg.right { left: calc(50%); }
  </style>
</head>
<body>
  <!-- 🐷 Cerdito con pupilas doble de tamaño -->
  <div class="abs w-100 h-100 bg-pink rounded-full" style="top:20px; left:20px;">
    <!-- Orejas -->
    <div class="abs w-25 h-25 bg-pink rounded-full" style="top:-10px; left:0;"></div>
    <div class="abs w-25 h-25 bg-pink rounded-full" style="top:-10px; right:0;"></div>

    <!-- Ojos con pupilas -->
    <div class="abs w-28 h-28 bg-white rounded-full flex items-center justify-center" style="top:25px; left:15px;">
      <div class="w-12 h-12 bg-black rounded-full"></div>
    </div>
    <div class="abs w-28 h-28 bg-white rounded-full flex items-center justify-center" style="top:25px; right:15px;">
      <div class="w-12 h-12 bg-black rounded-full"></div>
    </div>

    <!-- Nariz -->
    <div class="abs w-40 h-20 bg-darkpink rounded-half" style="bottom:30px; left:30px;">
      <div class="abs w-6 h-6 bg-black rounded-full" style="top:6px; left:8px;"></div>
      <div class="abs w-6 h-6 bg-black rounded-full" style="top:6px; right:8px;"></div>
    </div>

    <!-- Boca -->
    <div class="abs w-50 h-10 bg-darkpink rounded-bottom" style="bottom:10px; left:50%; transform:translateX(-50%);"></div>
  </div>

  <!-- 🏠 Casa convertida a utilitarias -->
  <div class="abs" style="top:20px; left:400px; width:100px; height:100px;">
    <!-- Chimenea -->
    <div class="abs bg-chimney" style="width:15px; height:50px; border:1px solid #5a0000; top:-10px; left:60px; z-index:0;"></div>

    <!-- Tejado -->
    <div class="abs" style="width:0; height:0; border-left:50px solid transparent; border-right:50px solid transparent; border-bottom:40px solid #a35d32; top:0; left:0; z-index:1;"></div>

    <!-- Paredes -->
    <div class="abs bg-lightbrown" style="top:40px; width:100px; height:60px;"></div>

    <!-- Puerta -->
    <div class="abs bg-brown" style="bottom:0; left:38px; width:25px; height:35px;"></div>

    <!-- Ventanas -->
    <div class="abs bg-blue" style="top:50px; left:10px; width:20px; height:20px; border:2px solid #4a4a4a;"></div>
    <div class="abs bg-blue" style="top:50px; right:10px; width:20px; height:20px; border:2px solid #4a4a4a;"></div>
  </div>

  <!-- 👽 Marciano intacto -->
  <div class="alien">
    <div class="alien-head">
      <div class="alien-eye left"><div class="alien-pupil"></div></div>
      <div class="alien-eye right"><div class="alien-pupil"></div></div>
      <div class="alien-mouth"></div>
    </div>
    <div class="alien-body"></div>
    <div class="alien-arm left"></div>
    <div class="alien-arm right"></div>
    <div class="alien-leg left"></div>
    <div class="alien-leg right"></div>
  </div>
</body>
</html>
